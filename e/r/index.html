<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Votos em Aratuba · Apuração</title>
<style>
  :root{
    --bg:#0e1014; --card:#161a21; --card2:#1c222c; --line:#262d3a;
    --txt:#e8eaf0; --mut:#8d96a8; --ac:#2dd4bf; --gold:#fbbf24;
    --silver:#cbd5e1; --bronze:#d98452;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:28px 16px 64px;
    background:radial-gradient(1100px 520px at 50% -12%,#1b2431,#0e1014 62%) fixed;
    color:var(--txt);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap{max-width:1020px;margin:0 auto}

  /* ---------- HEADER ---------- */
  header{margin-bottom:22px}
  .kicker{
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ac);font-weight:700;margin-bottom:6px;
  }
  h1{margin:0;font-size:clamp(24px,4vw,34px);letter-spacing:-.02em}
  .sub{margin:6px 0 0;color:var(--mut);font-size:14px}

  /* ---------- TABS ---------- */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 16px}
  .tab{
    border:1px solid var(--line);background:var(--card);color:var(--mut);
    padding:9px 15px;border-radius:999px;cursor:pointer;
    font:inherit;font-size:13.5px;font-weight:600;transition:.18s;
    white-space:nowrap;
  }
  .tab:hover{color:var(--txt);border-color:#38414f}
  .tab.on{
    background:linear-gradient(180deg,#2dd4bf,#14b8a6);
    border-color:transparent;color:#04211d;
    box-shadow:0 6px 20px -8px #2dd4bf;
  }

  /* ---------- STATS ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
  .stat{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;
  }
  .stat span{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
  .stat strong{display:block;margin-top:5px;font-size:19px;letter-spacing:-.01em}
  .stat strong.sm{font-size:15px;line-height:1.3}

  /* ---------- TOOLBAR ---------- */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
  .toolbar{
    display:flex;gap:10px;padding:14px;border-bottom:1px solid var(--line);
    background:var(--card2);flex-wrap:wrap;
  }
  .toolbar input,.toolbar select{
    font:inherit;color:var(--txt);background:#0f131a;
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;
  }
  .toolbar input{flex:1 1 240px}
  .toolbar input:focus,.toolbar select:focus{border-color:var(--ac);box-shadow:0 0 0 3px #2dd4bf22}
  .toolbar select{cursor:pointer}

  /* ---------- LISTA ---------- */
  .row{
    display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;
    padding:12px 16px;border-bottom:1px solid #1e242e;transition:background .15s;
  }
  .row:last-child{border-bottom:0}
  .row:hover{background:#1a202a}

  .rank{
    width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
    font-size:13px;font-weight:800;background:#0f131a;border:1px solid var(--line);color:var(--mut);
  }
  .r1 .rank{background:linear-gradient(180deg,#fbbf24,#f59e0b);color:#3a2500;border-color:transparent}
  .r2 .rank{background:linear-gradient(180deg,#cbd5e1,#94a3b8);color:#1e2530;border-color:transparent}
  .r3 .rank{background:linear-gradient(180deg,#d98452,#b45309);color:#2a1400;border-color:transparent}

  .name{font-weight:650;font-size:14.5px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .num{
    font-size:11px;font-weight:700;color:var(--mut);
    border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:#0f131a;
  }
  .party{font-size:12px;color:var(--ac);font-weight:700;letter-spacing:.04em;margin-top:2px}

  .bar{height:5px;border-radius:99px;background:#0f131a;margin-top:7px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,#14b8a6,#2dd4bf);transition:width .35s ease}
  .r1 .bar i{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
  .r2 .bar i{background:linear-gradient(90deg,#94a3b8,#cbd5e1)}
  .r3 .bar i{background:linear-gradient(90deg,#b45309,#d98452)}

  .votes{text-align:right;min-width:92px}
  .votes strong{display:block;font-size:15.5px;font-variant-numeric:tabular-nums}
  .votes small{display:block;font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}

  .empty{padding:44px 16px;text-align:center;color:var(--mut)}
  footer{margin-top:22px;text-align:center;color:#5d6675;font-size:12.5px}

  @media(max-width:560px){
    .row{grid-template-columns:34px 1fr auto;gap:9px;padding:11px 12px}
    .rank{width:26px;height:26px;font-size:11.5px;border-radius:8px}
    .votes{min-width:74px}
    .votes strong{font-size:14px}
  }
</style>
</head>

/* ============ ESTADO ============ */
const state = { cargo:'presidente', q:'', sort:'votos-desc' };
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('pt-BR');
const pct = (v,t) => (v/t*100).toFixed(2).replace('.',',') + '%';

/* ============ ABAS ============ */
function buildTabs(){
  $('tabs').innerHTML = Object.entries(CARGOS).map(([k,c]) =>
    `<button class="tab${k===state.cargo?' on':''}" data-cargo="${k}">${c.nome}</button>`
  ).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => {
    state.cargo = b.dataset.cargo;
    state.q = ''; $('q').value = '';
    buildTabs(); render();
  });
}

/* ============ RENDER ============ */
function render(){
  const c = CARGOS[state.cargo];
  const total = c.rows.reduce((s,r) => s + r[3], 0);
  const max   = Math.max(...c.rows.map(r => r[3]));

  /* ranking fixo por votos */
  const rank = new Map();
  c.rows.slice().sort((a,b) => b[3]-a[3]).forEach((r,i) => rank.set(r, i+1));

  /* cards */
  const top = c.rows.slice().sort((a,b) => b[3]-a[3])[0];
  $('stats').innerHTML = `
    <div class="stat"><span>Total de votos</span><strong>${fmt(total)}</strong></div>
    <div class="stat"><span>Candidatos com voto</span><strong>${c.rows.length}</strong></div>
    <div class="stat"><span>Mais votado</span><strong class="sm">${top[0]}<br>${fmt(top[3])} votos</strong></div>
  `;

  /* filtro */
  const q = state.q.trim().toLowerCase();
  let rows = c.rows.filter(r =>
    !q || r[0].toLowerCase().includes(q) || r[1].toLowerCase().includes(q) || String(r[2]).includes(q)
  );

  /* ordenação */
  switch(state.sort){
    case 'votos-desc': rows.sort((a,b) => b[3]-a[3]); break;
    case 'votos-asc':  rows.sort((a,b) => a[3]-b[3]); break;
    case 'nome':       rows.sort((a,b) => a[0].localeCompare(b[0],'pt-BR')); break;
    case 'partido':    rows.sort((a,b) => a[1].localeCompare(b[1],'pt-BR') || b[3]-a[3]); break;
  }

  if(!rows.length){
    $('lista').innerHTML = `<div class="empty">Nenhum candidato encontrado para “${state.q}”.</div>`;
    return;
  }

  $('lista').innerHTML = rows.map(r => {
    const [nome, partido, numero, votos] = r;
    const p = rank.get(r);
    const w = max ? (votos / max * 100) : 0;
    return `
      <div class="row${p<=3?' r'+p:''}">
        <div class="rank">${p}º</div>
        <div class="info">
          <div class="name">${nome}<span class="num">${numero}</span></div>
          <div class="party">${partido}</div>
          <div class="bar"><i style="width:${w}%"></i></div>
        </div>
        <div class="votes">
          <strong>${fmt(votos)}</strong>
          <small>${pct(votos,total)}</small>
        </div>
      </div>`;
  }).join('');
}

/* ============ EVENTOS ============ */
$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== $('q')){ e.preventDefault(); $('q').focus(); }
});

buildTabs();
render();
</script>
