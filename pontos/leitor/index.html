<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Leitor QR — Ponto</title>
<script src="jsQR.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f1115; color: #e5e7eb; overflow: hidden;
  }

  .tela {
    position: fixed; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px; gap: 14px; text-align: center;
  }
  .tela.visivel { display: flex; }

  .logo { font-size: 64px; margin-bottom: 8px; }
  h1 { font-size: 24px; margin: 0 0 6px; font-weight: 700; }
  .subtitulo { color: #9ca3af; font-size: 14px; margin: 0 0 32px; max-width: 320px; }

  .terminal-badge {
    position: absolute; top: 16px; right: 16px;
    background: #1f2937; border: 1px solid #374151;
    color: #93c5fd; font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 20px;
    font-family: ui-monospace, monospace;
  }
  .terminal-badge .dot {
    display: inline-block; width: 6px; height: 6px;
    background: #4ade80; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
  }

  .btn-grande {
    background: #4ade80; color: #0f1115;
    border: none; padding: 20px 60px;
    font-size: 18px; font-weight: 700;
    border-radius: 14px; cursor: pointer;
    min-width: 220px;
    transition: transform .1s, background .15s;
    box-shadow: 0 4px 16px rgba(74,222,128,.25);

  .btn-grande:active { transform: scale(.97); }
  .btn-grande:hover { background: #22c55e; }
  .btn-grande.secundario {
    background: #374151; color: #e5e7eb;
    box-shadow: none;
  }
  .btn-grande.secundario:hover { background: #4b5563; }

  .rodape-idle {
    position: absolute; bottom: 20px; left: 0; right: 0;
    display: flex; gap: 16px; justify-content: center;
    align-items: center; font-size: 12px; color: #6b7280;
  }
  .btn-link {
    background: none; border: none; color: #6b7280;
    cursor: pointer; font-size: 12px; text-decoration: underline;
    padding: 4px 8px;
  }
  .btn-link:hover { color: #9ca3af; }

  #tela-camera { padding: 0; gap: 0; }
  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; background: #000;
  }
  .overlay-camera {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .mira {
    width: 240px; height: 240px;
    border: 3px solid #4ade80; border-radius: 20px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.55);
    position: relative;
  }
  .mira::before, .mira::after {
    content: ""; position: absolute; width: 30px; height: 30px;
    border: 3px solid #4ade80;
  }
  .mira::before { top: -3px; left: -3px; border-right: none; border-bottom: none; border-radius: 20px 0 0 0; }
  .mira::after  { bottom: -3px; right: -3px; border-left: none; border-top: none; border-radius: 0 0 20px 0; }

  .instrucao {
    position: absolute; bottom: 120px; left: 0; right: 0;
    text-align: center; color: #fff; font-size: 14px;
    text-shadow: 0 1px 4px rgba(0,0,0,.9);
    font-weight: 500;
  }
  .btn-secundario {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.12); color: #fff;
    border: 1px solid rgba(255,255,255,.25);
    padding: 12px 32px; border-radius: 10px;
    font-size: 14px; cursor: pointer;
    backdrop-filter: blur(8px);
  }

  .icone-grande { font-size: 88px; line-height: 1; margin-bottom: 8px; }
  .icone-grande.ok  { color: #4ade80; }
  .icone-grande.erro { color: #f87171; }

  h2 { font-size: 22px; margin: 0; font-weight: 700; }
  .msg-ok {
    color: #4ade80; font-size: 15px; font-weight: 600;
    margin: 0 0 20px;
  }
  .msg-erro {
    color: #f87171; font-size: 14px; margin: 0 0 20px;
    max-width: 320px; line-height: 1.5;
  }

  .detalhes {
    background: #1a1d23; border: 1px solid #374151;
    border-radius: 10px; padding: 14px 16px;
    width: 100%; max-width: 340px;
    text-align: left; font-size: 13px; line-height: 1.7;
    margin-bottom: 20px;
  }
  .linha { display: flex; gap: 8px; }
  .rotulo { color: #93c5fd; min-width: 90px; flex-shrink: 0; font-size: 12px; }
  .valor { color: #fde68a; word-break: break-word; font-size: 12px; }

  .tag {
    display: inline-block; padding: 2px 8px;
    border-radius: 4px; font-size: 11px; font-weight: 600;
  }
  .tag-entrada { background: rgba(74,222,128,.15); color: #4ade80; }
  .tag-saida   { background: rgba(248,113,113,.15); color: #f87171; }

  .botoes-resultado {
    display: flex; gap: 12px; flex-wrap: wrap;
    justify-content: center;
  }

  .boot-erro {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; padding: 24px; text-align: center; gap: 16px;
  }
  .boot-erro pre {
    color: #9ca3af; white-space: pre-wrap;
    font-size: 13px; max-width: 500px;
    font-family: ui-monospace, monospace;
    background: #1a1d23; padding: 14px 18px;
    border-radius: 8px; border: 1px solid #374151;
    text-align: left; margin: 0;
  }
</style>

<body>

<div id="tela-idle" class="tela visivel">
  <div class="terminal-badge" id="badge-terminal" style="display:none;">
    <span class="dot"></span><span id="badge-texto">—</span>
  </div>
  <div class="logo">🔍</div>
  <h1>Leitor de Ponto</h1>

  <button id="btnIniciar" class="btn-grande">Validar</button>

  <div class="rodape-idle">
    <span id="contadorLeituras">0 leituras</span>

</div>

<!-- ============ TELA 4: ERRO ============ -->
<div id="tela-erro" class="tela">
  <div class="icone-grande erro">❌</div>
  <h2>QR Inválido</h2>
  <p class="msg-erro" id="erro-motivo">—</p>
  <div class="detalhes" id="erro-detalhes"></div>
  <div class="botoes-resultado">
    <button id="btnTentarNovamente" class="btn-grande">Tentar novamente</button>
    <button id="btnVoltar" class="btn-grande secundario">OK</button>
  </div>
</div>

<script>
// =========================================================
// CONFIGURAÇÃO
// =========================================================

// URL do servidor. Deixe "Enviar qr " para não enviar (só loga no console).
const SERVER_URL = "";

const TOL_FUTURO  = 20; // segundos à frente
const TOL_PASSADO = 45; // segundos atrás

// =========================================================
// TABELA DE TIPOS (campo 50)
// =========================================================

const TIPOS = {
  "00": "Início do expediente",
  "01": "Retorno do almoço",
  "02": "Retorno de atividade externa",
  "03": "Retorno de atividade interna",
  "04": "Retorno de reunião",
  "05": "Retorno de treinamento",
  "06": "Retorno de serviço externo",
  "07": "Retorno de visita",
  "08": "Retorno autorizado",
  "09": "Retorno de intervalo",
  "49": "Entrada — outros motivos",
  "50": "Final do expediente",
  "51": "Saída para almoço",
  "52": "Saída para atividade externa",
  "53": "Saída de atividade interna",
  "54": "Saída para reunião",
  "55": "Saída para treinamento",
  "56": "Saída para serviço externo",
  "57": "Saída para visita",
  "58": "Saída autorizada",
  "59": "Saída para intervalo",
  "99": "Saída — questões médicas"
};

function descricaoTipo(cod) { return TIPOS[cod] || "Código " + cod; }
function categoriaTipo(cod) {
  const n = parseInt(cod, 10);
  return isNaN(n) ? "?" : (n < 50 ? "Entrada" : "Saída");
}

// =========================================================
// ESTADO
// =========================================================

let FUNCIONARIOS = [];
let TERMINAIS    = [];
let GEOFENCE     = null;   // preenchido no boot com a config do terminal

let stream = null;
let animando = false;
let ultimoQR = "";

// =========================================================
// PARSER DE CSV
// =========================================================

function parseCSV(texto) {
  const linhas = texto.replace(/^\uFEFF/, "").trim().split(/\r?\n/);
  if (linhas.length < 2) return [];

  const SEP = linhas[0].includes(";") ? ";" : ",";
  const cab = linhas[0].split(SEP).map(c => c.trim().toLowerCase());

  return linhas.slice(1)
    .filter(l => l.trim() !== "")
    .map(l => {
      const v = l.split(SEP);
      const o = {};
      cab.forEach((c, i) => o[c] = (v[i] || "").trim());
      return o;
    });
}

// =========================================================
// CARREGAMENTO DOS CSVs
// =========================================================

async function carregarCSVs() {
  const [r1, r2] = await Promise.all([
    fetch("dados.csv?t=" + Date.now()),
    fetch("terminais.csv?t=" + Date.now())
  ]);

  if (!r1.ok) throw new Error("HTTP " + r1.status + " ao carregar dados.csv");
  if (!r2.ok) throw new Error("HTTP " + r2.status + " ao carregar terminais.csv");

  FUNCIONARIOS = parseCSV(await r1.text());
  TERMINAIS    = parseCSV(await r2.text());

  console.log("CSVs carregados:", FUNCIONARIOS.length, "funcionários,", TERMINAIS.length, "terminais");
}

// =========================================================
// CONFIG DO TERMINAL (via URL)
// =========================================================

function carregarTerminal() {
  const p = new URLSearchParams(location.search);
  const id = (p.get("terminal") || "").trim();

  if (!id) {
    throw new Error(
      "Falta o parâmetro ?terminal=ID na URL.\n\n" +
      "Exemplo:\n" +
      "  index.html?terminal=1\n\n" +
      "Cada terminal tem seu atalho com o ID correto."
    );
  }

  const t = TERMINAIS.find(t => t.id === id);
  if (!t) {
    throw new Error(
      "Terminal " + id + " não encontrado em terminais.csv.\n\n" +
      "Terminais disponíveis: " +
      TERMINAIS.map(t => t.id).join(", ")
    );
  }

  GEOFENCE = {
    ativo: true,
    id: t.id,
    cnpj: (t.cnpj || "").trim() || null,
    lat: parseFloat(t.lat),
    lon: parseFloat(t.lon),
    raioMetros: parseInt(t.raio, 10)
  };

  console.log("Terminal configurado:", GEOFENCE);
}

// =========================================================
// UTILITÁRIOS
// =========================================================

async function sha256(texto) {
  const dados = new TextEncoder().encode(texto);
  const hash = await crypto.subtle.digest("SHA-256", dados);
  return [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2, "0"))
    .join("").toUpperCase();
}

const fmtCpf  = c => c.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
const fmtCnpj = c => c.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, "$1.$2.$3/$4-$5");

function fmtData(ts) {
  const d = new Date(ts * 1000);
  const p = n => String(n).padStart(2, "0");
  return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear()
       + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

function beep(freq, dur) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + dur / 1000);
    osc.start();
    osc.stop(ctx.currentTime + dur / 1000);
  } catch (e) {}
}

// ---------------------------------------------------------
// GEOFENCE — Haversine
// ---------------------------------------------------------

function distanciaMetros(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2
          + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2))
          * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function fmtDistancia(m) {
  if (m < 1000) return Math.round(m) + "m";
  return (m / 1000).toFixed(2) + "km";
}

// =========================================================
// PARSER DA STRING DO QR
// =========================================================

function parsear(qr) {
  const out = {}; let p = 0;
  const lerFixo = t => { const v = qr.slice(p, p + t); p += t; return v; };
  const lerAte  = term => {
    const f = qr.indexOf(term, p);
    if (f === -1) throw new Error("Terminador '" + term + "' ausente");
    const v = qr.slice(p, f); p = f + 1; return v;
  };

  if (lerFixo(2) !== "00") throw new Error("Falta campo 00");
  out.versao = lerFixo(2);
  if (lerFixo(2) !== "10") throw new Error("Falta campo 10");
  out.hashCnpj = lerFixo(64);
  if (lerFixo(2) !== "20") throw new Error("Falta campo 20");
  out.hashCpf = lerFixo(64);
  if (lerFixo(2) !== "40") throw new Error("Falta campo 40");
  out.lat = lerAte("x");
  if (lerFixo(2) !== "41") throw new Error("Falta campo 41");
  out.lon = lerAte("x");
  if (lerFixo(2) !== "50") throw new Error("Falta campo 50");
  out.tipo = lerFixo(2);
  if (lerFixo(2) !== "61") throw new Error("Falta campo 61");
  out.timestamp = lerAte("x");
  if (lerFixo(2) !== "99") throw new Error("Falta campo 99");
  out.hashFinal = lerFixo(64);
  out.fimDados = p - 2 - 64;
  return out;
}

// =========================================================
// LOOKUP NOS CSVs
// =========================================================

async function acharCpf(hash, ts) {
  for (const f of FUNCIONARIOS) {
    if (await sha256("CPF:" + f.cpf + ":" + ts) === hash) return f;
  }
  return null;
}

async function acharCnpj(hash, ts) {
  const vistos = new Set();
  for (const f of FUNCIONARIOS) {
    if (vistos.has(f.cnpj)) continue;
    vistos.add(f.cnpj);
    if (await sha256("CNPJ:" + f.cnpj + ":" + ts) === hash) return f;
  }
  return null;
}

// =========================================================
// SERVIDOR + CSV LOCAL
// =========================================================

async function enviarServidor(qr) {
  if (!SERVER_URL) {
    console.log("[mock] enviaria para servidor:", qr);
    return { ok: true, mock: true };
  }
  try {
    const url = SERVER_URL
      + "?terminal=" + encodeURIComponent(GEOFENCE ? GEOFENCE.id : "")
      + "&qr=" + encodeURIComponent(qr);
    const r = await fetch(url);
    return { ok: r.ok, status: r.status };
  } catch (e) {
    return { ok: false, erro: e.message };
  }
}

function salvarLeitura(leitura) {
  const lista = JSON.parse(localStorage.getItem("pontos") || "[]");
  lista.push(leitura);
  localStorage.setItem("pontos", JSON.stringify(lista));
  atualizarContador();
}

function atualizarContador() {
  const lista = JSON.parse(localStorage.getItem("pontos") || "[]");
  const el = document.getElementById("contadorLeituras");
  if (el) el.textContent = lista.length + " leitura" + (lista.length === 1 ? "" : "s");
}

function baixarCSV() {
  const lista = JSON.parse(localStorage.getItem("pontos") || "[]");
  if (lista.length === 0) return alert("Nenhuma leitura para exportar.");

  const cab = "data_hora,terminal,cpf,nome,login,cnpj,empresa,tipo,descricao,categoria,lat,lon,distancia_m,qr";
  const linhas = lista.map(l =>
    [l.dataHora, l.terminal, l.cpf, l.nome, l.login, l.cnpj, l.empresa,
     l.tipo, l.descricao, l.categoria, l.lat, l.lon,
     l.distancia !== null && l.distancia !== undefined ? Math.round(l.distancia) : "",
     l.qr]
      .map(c => '"' + String(c).replace(/"/g, '""') + '"')
      .join(",")
  );
  const csv = "\uFEFF" + [cab, ...linhas].join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "pontos_" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
  URL.revokeObjectURL(url);
}

// =========================================================
// TELAS
// =========================================================

function mostrarTela(id) {
  document.querySelectorAll(".tela").forEach(t => t.classList.remove("visivel"));
  document.getElementById(id).classList.add("visivel");
}

function mostrarBadgeTerminal() {
  const el  = document.getElementById("badge-terminal");
  const txt = document.getElementById("badge-texto");
  if (GEOFENCE) {
    txt.textContent = "terminal " + GEOFENCE.id;
    el.style.display = "block";
  }
}

// =========================================================
// CÂMERA
// =========================================================

async function abrirCamera() {
  const video  = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx    = canvas.getContext("2d");

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });
    video.srcObject = stream;
    await video.play();

    animando = true;
    ultimoQR = "";
    mostrarTela("tela-camera");

    const tick = () => {
      if (!animando) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(img.data, img.width, img.height, {
          inversionAttempts: "dontInvert"
        });

        if (code && code.data && code.data !== ultimoQR) {
          ultimoQR = code.data;
          validar(code.data);
        }
      }
      requestAnimationFrame(tick);
    };
    tick();

  } catch (e) {
    alert("Não foi possível abrir a câmera: " + e.message);
  }
}

function fecharCamera() {
  animando = false;
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
}

// =========================================================
// VALIDAÇÃO
// =========================================================

async function validar(qr) {
  // 1. Parser
  let c;
  try {
    c = parsear(qr);
  } catch (e) {
    return telaErro("Não foi possível ler o QR.", "Layout inválido: " + e.message);
  }

  // 2. Assinatura
  const dados = qr.slice(0, c.fimDados);
  const esperado = await sha256(dados);
  if (esperado !== c.hashFinal) {
    return telaErro("Assinatura do QR não confere.", "O conteúdo foi alterado ou o QR é falso.", c);
  }

  // 3. Janela de tempo
  const agora = Math.floor(Date.now() / 1000);
  const ts = parseInt(c.timestamp, 10);
  const delta = agora - ts;

  if (delta < -TOL_FUTURO) {
    return telaErro("QR do futuro.", "Diferença de " + (-delta) + "s à frente (máx " + TOL_FUTURO + "s).", c);
  }
  if (delta > TOL_PASSADO) {
    return telaErro("QR expirado.", "Gerado há " + delta + "s (máx " + TOL_PASSADO + "s).", c);
  }

  // 4. Lookup do funcionário e empresa
  const func = await acharCpf(c.hashCpf, ts);
  const emp  = await acharCnpj(c.hashCnpj, ts);

  if (!func) return telaErro("Funcionário não encontrado.", "CPF do QR não está no dados.csv.", c);
  if (!emp)  return telaErro("Empresa não encontrada.", "CNPJ do QR não está no dados.csv.", c);

  // 5. Geofence (baseado no terminal, não no QR)
  let distancia = null;
  if (GEOFENCE && GEOFENCE.ativo) {
    distancia = distanciaMetros(
      parseFloat(c.lat), parseFloat(c.lon),
      GEOFENCE.lat, GEOFENCE.lon
    );

    if (distancia > GEOFENCE.raioMetros) {
      return telaErro(
        "Fora do local de trabalho.",
        "Distância de " + fmtDistancia(distancia)
        + " do terminal (máx " + GEOFENCE.raioMetros + "m).",
        c
      );
    }

    // 6. Empresa do terminal (só se estiver definida no terminais.csv)
    if (GEOFENCE.cnpj && emp.cnpj !== GEOFENCE.cnpj) {
      return telaErro(
        "Funcionário de outra empresa.",
        "Este terminal só aceita funcionários da empresa "
        + fmtCnpj(GEOFENCE.cnpj) + ".",
        c
      );
    }
  }

  // 7. Tudo OK
  telaSucesso(qr, c, func, emp, distancia);
}

// =========================================================
// TELA DE SUCESSO
// =========================================================

async function telaSucesso(qr, c, func, emp, distancia) {
  fecharCamera();
  beep(880, 150);

  const ts = parseInt(c.timestamp, 10);
  const desc = descricaoTipo(c.tipo);
  const cat  = categoriaTipo(c.tipo);

  document.getElementById("sucesso-nome").textContent = func.nome;

  const tagClass = cat === "Entrada" ? "tag-entrada" : "tag-saida";

  const linhaGeo = (GEOFENCE && distancia !== null)
    ? linha("Local", "📍 " + fmtDistancia(distancia) + " do terminal ✅")
    : "";

  document.getElementById("sucesso-detalhes").innerHTML =
      linha("CPF", fmtCpf(func.cpf))
    + linha("Login", func.login)
    + linha("Empresa", emp.empresa)
    + linha("CNPJ", fmtCnpj(emp.cnpj))
    + linha("Tipo", '<span class="tag ' + tagClass + '">' + cat + '</span> ' + desc)
    + linha("Data/hora", fmtData(ts))
    + linhaGeo;

  mostrarTela("tela-sucesso");

  // Envia pro servidor (não bloqueia UI)
  const resp = await enviarServidor(qr);
  if (!resp.ok) console.warn("Servidor respondeu com erro:", resp);

  // Salva no CSV local
  salvarLeitura({
    dataHora: fmtData(ts),
    terminal: GEOFENCE ? GEOFENCE.id : "",
    cpf: func.cpf,
    nome: func.nome,
    login: func.login,
    cnpj: emp.cnpj,
    empresa: emp.empresa,
    tipo: c.tipo,
    descricao: desc,
    categoria: cat,
    lat: c.lat,
    lon: c.lon,
    distancia: distancia,
    qr: qr
  });
}

// =========================================================
// TELA DE ERRO
// =========================================================

function telaErro(motivo, detalhe, c) {
  fecharCamera();
  beep(220, 400);

  document.getElementById("erro-motivo").textContent = motivo;

  let html = detalhe
    ? '<div class="linha"><span class="rotulo">Motivo</span><span class="valor">' + detalhe + '</span></div>'
    : "";

  if (c) {
    const desc = descricaoTipo(c.tipo);
    const cat  = categoriaTipo(c.tipo);
    const tagClass = cat === "Entrada" ? "tag-entrada" : "tag-saida";

    let linhaGeo = "";
    if (GEOFENCE && GEOFENCE.ativo && c.lat && c.lon) {
      const d = distanciaMetros(
        parseFloat(c.lat), parseFloat(c.lon),
        GEOFENCE.lat, GEOFENCE.lon
      );
      linhaGeo = linha("Distância", fmtDistancia(d)
        + (d > GEOFENCE.raioMetros ? " ❌" : " ✅"));
    }

    html += linha("Campo 50", c.tipo + " — " + desc);
    html += linha("Categoria", '<span class="tag ' + tagClass + '">' + cat + '</span>');
    html += linha("Timestamp", c.timestamp);
    html += linha("Latitude", c.lat);
    html += linha("Longitude", c.lon);
    html += linhaGeo;
  }

  document.getElementById("erro-detalhes").innerHTML = html;
  mostrarTela("tela-erro");
}

function linha(rotulo, valor) {
  return '<div class="linha"><span class="rotulo">' + rotulo + '</span><span class="valor">' + valor + '</span></div>';
}
