<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar QR Code</title>
</head>
<body>

<h2>Gerar QR Code</h2>

<form action="https://ivanildo.net.br/pontos/gerador.html" method="get">

    <label for="cnpj">CNPJ:</label><br>
    <input
        type="text"
        id="cnpj"
        name="cnpj"
        required
    ><br><br>

    <label for="cpf">CPF:</label><br>
    <input
        type="text"
        id="cpf"
        name="cpf"
        required
    ><br><br>

    <label for="checkpoint">Checkpoint:</label><br>
    <input
        type="text"
        id="checkpoint"
        name="checkpoint"
        required
    ><br><br>

    <button type="submit">Gerar QR Code</button>

</form>

</body>
</html>
